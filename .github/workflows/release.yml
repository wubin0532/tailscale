name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install UPX
        run: |
          curl -sL https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-amd64_linux.tar.xz | tar xJ
          sudo install -m755 upx-4.2.4-amd64_linux/upx /usr/local/bin/upx

      - name: Build po2lmo (LuCI i18n)
        run: |
          git clone --depth 1 https://github.com/openwrt/luci.git /tmp/luci
          mkdir -p build
          cc -O2 -o build/po2lmo /tmp/luci/modules/luci-base/src/po2lmo.c /tmp/luci/modules/luci-base/src/sfh_hash.c

      - name: Build tailscaled binaries
        run: |
          TS_VER=$(sed -n 's/^PKG_VERSION:=//p' tailscale/Makefile)
          echo "tailscale $TS_VER"
          git clone --depth 1 --branch "v$TS_VER" https://github.com/tailscale/tailscale.git /tmp/ts
          mkdir -p build/bin/upx
          TAGS="ts_include_cli,ts_omit_aws,ts_omit_bird,ts_omit_completion,ts_omit_kube,ts_omit_systray,ts_omit_taildrop,ts_omit_tap,ts_omit_tpm,ts_omit_acme,ts_omit_connectivity_control,ts_omit_debugeventbus,ts_omit_debugportmapper,ts_omit_desktop_sessions,ts_omit_drive,ts_omit_kubernetes,ts_omit_oauthkey,ts_omit_outboundproxy,ts_omit_posture"
          LDFLAGS="-s -w -X tailscale.com/version.longStamp=$TS_VER (OpenWrt) -X tailscale.com/version.shortStamp=$TS_VER"
          for pair in arm64:arm64 armv7:armv7 mipsle:mipsle amd64:amd64; do
            name="${pair%%:*}"; goarch="${pair##*:}"
            extra=""; [ "$goarch" = armv7 ] && extra="GOARM=7"
            echo "=== building linux/$goarch ==="
            env GOOS=linux GOARCH=$goarch $extra GOFLAGS=-mod=mod \
              go build -C /tmp/ts -tags "$TAGS" -ldflags "$LDFLAGS" \
              -o "$PWD/build/bin/upx/tailscaled-linux-$name" ./cmd/tailscaled
          done
          upx --lzma --best build/bin/upx/tailscaled-linux-*

      - name: Assemble ipk + apk packages
        run: ./build-ipk.sh

      - name: Upload build artifacts (workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-luci-packages
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.ipk
            dist/*.apk
          generate_release_notes: true
