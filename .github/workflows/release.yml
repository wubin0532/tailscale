name: Build offline run installers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Regression tests
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/test_views.js
          bash -n build-run.sh prepare-core.sh
          for script in packaging/install.sh packaging/run-header.sh luci-app-tailscale/root/etc/init.d/tailscale luci-app-tailscale/root/usr/lib/tailscale-luci.sh luci-app-tailscale/root/usr/lib/tailscale-luci-uninstall.sh luci-app-tailscale/root/usr/libexec/rpcd/tailscale luci-app-tailscale/root/usr/libexec/tailscale-route-watch; do
            sh -n "$script"
          done
      - name: Build po2lmo
        run: |
          git clone --depth 1 https://github.com/openwrt/luci.git /tmp/luci
          make -C /tmp/luci/modules/luci-base/src po2lmo
          mkdir -p build
          cp /tmp/luci/modules/luci-base/src/po2lmo build/po2lmo
      - name: Install pinned UPX and architecture test runners
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-user
          curl -fL --retry 2 -o /tmp/upx.tar.xz https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-amd64_linux.tar.xz
          echo '402162aad30af47e60dbd767fb2e64ca394ace9727ba1f40283641f1d1b91657  /tmp/upx.tar.xz' | sha256sum -c -
          tar -xJf /tmp/upx.tar.xz -C /tmp
          echo "UPX_BIN=/tmp/upx-5.2.1-amd64_linux/upx" >> "$GITHUB_ENV"
      - name: Restore pinned core build cache
        id: core-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            build/combined
            build/source
          key: tailscale-core-${{ runner.os }}-${{ hashFiles('core-version.env', 'prepare-core.sh') }}
      - name: Build full-feature combined core and offline installers
        run: ./build-run.sh
      - name: Save verified core build cache
        if: steps.core-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            build/combined
            build/source
          key: tailscale-core-${{ runner.os }}-${{ hashFiles('core-version.env', 'prepare-core.sh') }}
      - name: Verify payloads and executable dependencies
        run: python3 tests/verify_run.py --execute
      - name: Verify native OpenWrt opkg and iStore install and uninstall
        run: sudo python3 tests/verify_native_registration.py
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: tailscale-luci-run-v2.2.0
          path: |
            dist/*.run
            dist/SHA256SUMS-v2.2.0-run.txt
