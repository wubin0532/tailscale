  table.table td { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }

  /* toggle switch */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; vertical-align: middle; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; transition: .2s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: #2196f3; }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .cbi-checkbox { display: inline-flex; align-items: center; }
  .cbi-checkbox input[type=checkbox] { width: 18px; height: 18px; accent-color: #2196f3; }
